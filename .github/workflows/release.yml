name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Require the tag to match Version.props
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's:.*<Version\(Major\|Minor\|Patch\)>\([0-9]*\)<.*:\2:p' Version.props | paste -sd.)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Version.props $version."
            exit 1
          fi
      - name: Build, test and pack
        run: |
          dotnet build DelphiModernizer.Engine.slnx -c Release
          dotnet test DelphiModernizer.Engine.slnx -c Release --no-build
          dotnet pack DelphiModernizer.Engine.slnx -c Release --no-build -o artifacts/packages
      - name: Publish to GitHub Packages
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://nuget.pkg.github.com/delphi-modernizer/index.json
          --api-key "$NUGET_TOKEN"
          --skip-duplicate

  binaries:
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish self-contained dmz
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/DelphiModernizer.Cli -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -o "publish/$rid"
            (cd "publish/$rid" && zip -qr "../../dist/dmz-$TAG-$rid.zip" .)
          done
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
